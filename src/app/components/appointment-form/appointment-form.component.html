<h2>Appointment Form</h2>
<form (ngSubmit)="onSubmit(appointmentForm)" #appointmentForm="ngForm">
  <div>
    <label for="appointmentId">Appointment Id:</label>
    <input type="text" id="appointmentId" required [(ngModel)]="appointment.appointmentId" name="appointmentId">
  </div>
  <div>
    <label for="title">Title:</label>
    <input type="text" id="title" required [(ngModel)]="appointment.title" name="title">
  </div>
  <div>
    <label for="appointmentDate">Date:</label>
    <input type="date" id="appointmentDate" required [(ngModel)]="appointment.appointmentDate" name="appointmentDate">
  </div>
  <div>
    <label for="time">Time:</label>
    <input type="time" id="time" required [(ngModel)]="appointment.time" name="time">
  </div>
  <div>
    <label for="description">Description:</label>
    <textarea id="description" [(ngModel)]="appointment.description" name="description"></textarea>
  </div>
  <div>
    <label for="appointmentStatusId">Status:</label>
    <input type="number" id="appointmentStatusId" required [(ngModel)]="appointment.appointmentStatusId" name="appointmentStatusId">
    <select id="appointmentStatusId" required [(ngModel)]="appointment.appointmentStatusId" name="appointmentStatusId">
      <option *ngFor="let status of appointmentStatusOptions" [value]="status.AppointmentStatusName">{{ status.AppointmentStatusName }}</option>
    </select>
  </div>
  <button type="submit" [disabled]="!appointmentForm.form.valid">Save Appointment</button>
</form>
